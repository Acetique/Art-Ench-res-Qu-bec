
name: Collecte Gelineau

on:
  workflow_dispatch:

  schedule:
    # Chaque jour à 11 h 20 UTC
    - cron: "20 11 * * *"

permissions:
  contents: write

concurrency:
  group: collecte-gelineau
  cancel-in-progress: false

jobs:
  collecter:
    name: Collecter les encans Gelineau
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      # 1. Recuperer le depot
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. Installer Python
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Installer les dependances
      - name: Installer les dependances
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install \
            requests \
            beautifulsoup4 \
            lxml

      # 4. Verifier le collecteur
      - name: Verifier le collecteur Gelineau
        shell: bash
        run: |
          test -f Collectors/collect_gelineau.py || {
            echo "ERREUR : collecteur introuvable"
            exit 1
          }

          python -m py_compile Collectors/collect_gelineau.py
          echo "Collecteur Python valide"

      # 5. Executer la collecte
      - name: Collecter les encans Gelineau
        shell: bash
        run: |
          echo "======================================"
          echo "ART ENCHERES QUEBEC"
          echo "COLLECTE GELINEAU"
          echo "======================================"

          python -u Collectors/collect_gelineau.py

      # 6. Verifier le fichier JSON
      - name: Verifier les donnees Gelineau
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/gelineau.json")

          if not path.exists():
              raise SystemExit("ERREUR : data/gelineau.json absent")

          raw = path.read_text(encoding="utf-8").strip()

          if not raw:
              raise SystemExit("ERREUR : fichier JSON vide")

          data = json.loads(raw)

          if isinstance(data, list):
              lots = data
          elif isinstance(data, dict):
              lots = data.get("oeuvres", data.get("lots", []))
          else:
              raise SystemExit("ERREUR : format JSON invalide")

          if not isinstance(lots, list):
              raise SystemExit("ERREUR : lots invalides")

          print("======================================")
          print("RESULTATS GELINEAU")
          print("======================================")
          print("Nombre de lots :", len(lots))

          for field in ("prix_marteau", "estimation_min", "image"):
              count = sum(
                  bool(item.get(field))
                  for item in lots
                  if isinstance(item, dict)
              )
              print(field, ":", count)

          print("Fichier JSON valide")
          PY

      # 7. Enregistrer les donnees
      - name: Enregistrer les donnees dans GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gelineau.json

          if [ -d data/gelineau ]; then
            git add -A data/gelineau
          fi

          if [ -d images/gelineau ]; then
            git add -A images/gelineau
          fi

          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnee"
          else
            git commit -m "Actualisation Gelineau"

            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # 8. Rapport final
      - name: Rapport final
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "ART ENCHERES QUEBEC"
          echo "RAPPORT FINAL GELINEAU"
          echo "======================================"

          if [ -f data/gelineau.json ]; then
            echo "Fichier Gelineau present"
          else
            echo "Fichier Gelineau absent"
          fi

          echo "Fin du workflow"
