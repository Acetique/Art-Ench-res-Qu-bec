
name: Collecte publique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:
  collecte:
    name: Actualiser les oeuvres
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Verifier les dossiers
        run: |
          mkdir -p data
          test -d collector
          ls -la collector

      - name: Collecter les tableaux
        run: |
          python collector/collect.py

      - name: Verifier les donnees JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/oeuvres.json")

          if not path.exists():
              raise SystemExit("ERREUR: data/oeuvres.json absent")

          with path.open(encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, (list, dict)):
              raise SystemExit("Format JSON invalide")

          print("Fichier JSON valide")
          print("Taille:", path.stat().st_size, "octets")
          PY

      - name: Enregistrer les nouvelles oeuvres
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Aucune modification a enregistrer."
          else
            git commit -m "Mise a jour automatique des oeuvres"
            git push
          fi

