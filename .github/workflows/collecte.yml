
name: Collecte publique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:
  collecte:
    name: Art Encheres Quebec V8.2
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Collectors/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Collectors/requirements.txt

      - name: Verifier la syntaxe Python
        run: |
          python -m py_compile Collectors/collect.py

      - name: Executer la collecte V8.2
        run: |
          python -u Collectors/collect.py

      - name: Valider les fichiers JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fichiers = [
              "data/oeuvres.json",
              "data/rapport-collecte.json",
              "data/rapport-qualite.json",
              "data/rapport-differences.json",
          ]

          for nom in fichiers:
              chemin = Path(nom)

              if not chemin.exists():
                  raise SystemExit(
                      f"Fichier manquant : {nom}"
                  )

              with chemin.open(encoding="utf-8") as f:
                  json.load(f)

              print("JSON valide :", nom)

          with open(
              "data/oeuvres.json",
              encoding="utf-8"
          ) as f:
              oeuvres = json.load(f)

          with open(
              "data/rapport-collecte.json",
              encoding="utf-8"
          ) as f:
              rapport = json.load(f)

          with open(
              "data/rapport-qualite.json",
              encoding="utf-8"
          ) as f:
              qualite = json.load(f)

          with open(
              "data/rapport-differences.json",
              encoding="utf-8"
          ) as f:
              differences = json.load(f)

          assert isinstance(oeuvres, list)
          assert rapport["version"] == "V8.2"
          assert qualite["version"] == "V8.2"
          assert differences["version"] == "V8.2"

          assert rapport["total_oeuvres"] == len(oeuvres)

          if len(oeuvres) < 488:
              raise SystemExit(
                  "ERREUR : moins de 488 notices. "
                  "Publication annulee."
              )

          print("=" * 50)
          print("ART ENCHERES QUEBEC V8.2")
          print("=" * 50)

          print("Notices :", len(oeuvres))
          print(
              "Estimations :",
              qualite["avec_estimation"]
          )
          print(
              "Dimensions :",
              qualite["avec_dimensions"]
          )
          print(
              "Rapprochements :",
              qualite["nombre_rapprochements"]
          )
          print(
              "Notices a controler :",
              qualite["nombre_notices_a_controler"]
          )
          print(
              "Lots historiques non redetectes :",
              differences["non_redetectes"]
          )
          print(
              "Conflits :",
              len(differences["conflits_a_verifier"])
          )
          PY

      - name: Enregistrer les resultats sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/oeuvres.json
          git add data/rapport-collecte.json
          git add data/rapport-qualite.json
          git add data/rapport-differences.json

          if git diff --cached --quiet; then
            echo "Aucun changement a enregistrer."
          else
            git commit -m "Actualisation Art Encheres Quebec V8.2"
            git pull --rebase
            git push
          fi

      - name: Afficher le rapport final
        if: always()
        run: |
          echo "======================================"
          echo "ART ENCHERES QUEBEC - RAPPORT V8.2"
          echo "======================================"

          if [ -f data/rapport-collecte.json ]; then
            cat data/rapport-collecte.json
          fi
