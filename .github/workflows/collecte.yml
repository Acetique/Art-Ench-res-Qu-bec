
name: Collecte publique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:
  collecte:
    name: Art Encheres Quebec V7
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # =====================================
      # 1. RECUPERER LE DEPOT
      # =====================================

      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      # =====================================
      # 2. INSTALLER PYTHON
      # =====================================

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Collectors/requirements.txt

      # =====================================
      # 3. INSTALLER LES DEPENDANCES
      # =====================================

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Collectors/requirements.txt

      # =====================================
      # 4. VERIFIER LE CODE
      # =====================================

      - name: Verifier le collecteur V7
        run: |
          mkdir -p data
          test -f Collectors/collect.py
          python -m py_compile Collectors/collect.py

      # =====================================
      # 5. LANCER LA COLLECTE
      # =====================================

      - name: Collecter les catalogues V7
        run: |
          python Collectors/collect.py

      # =====================================
      # 6. VERIFIER LES DONNEES
      # =====================================

      - name: Verifier les fichiers JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              "data/oeuvres.json",
              "data/rapport-collecte.json",
              "data/rapport-qualite.json",
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  raise SystemExit(
                      f"Fichier absent : {filename}"
                  )

              with path.open(encoding="utf-8") as f:
                  json.load(f)

              print("JSON valide :", filename)

          with open(
              "data/oeuvres.json",
              encoding="utf-8"
          ) as f:
              oeuvres = json.load(f)

          with open(
              "data/rapport-qualite.json",
              encoding="utf-8"
          ) as f:
              quality = json.load(f)

          if not isinstance(oeuvres, list):
              raise SystemExit(
                  "Format oeuvres.json invalide"
              )

          print()
          print("ART ENCHERES QUEBEC V7")
          print("======================")
          print("Total oeuvres :", len(oeuvres))
          print(
              "Avec estimation :",
              quality.get("avec_estimation")
          )
          print(
              "Avec dimensions :",
              quality.get("avec_dimensions")
          )
          print(
              "Rapprochements potentiels :",
              quality.get("nombre_rapprochements")
          )
          print(
              "Notices a controler :",
              quality.get("nombre_notices_a_controler")
          )
          PY

      # =====================================
      # 7. SAUVEGARDER SUR GITHUB
      # =====================================

      - name: Enregistrer les resultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/oeuvres.json
          git add data/rapport-collecte.json
          git add data/rapport-qualite.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Actualisation Art Encheres Quebec V7"
            git pull --rebase
            git push
          fi

      # =====================================
      # 8. RAPPORT FINAL
      # =====================================

      - name: Rapport final
        if: always()
        run: |
          echo "================================"
          echo " ART ENCHERES QUEBEC V7"
          echo "================================"

          if [ -f data/rapport-collecte.json ]; then
            cat data/rapport-collecte.json
          fi

          echo ""
          echo "Fin de la collecte."
