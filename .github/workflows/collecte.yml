
name: Collecte publique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:
  collecte:
    name: Art Encheres Quebec V6
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # ========================================
      # 1. RECUPERER LE DEPOT
      # ========================================

      - name: Recuperer le depot
        uses: actions/checkout@v4

      # ========================================
      # 2. INSTALLER PYTHON
      # ========================================

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ========================================
      # 3. INSTALLER LES DEPENDANCES
      # ========================================

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r Collectors/requirements.txt

      # ========================================
      # 4. VERIFIER LES FICHIERS
      # ========================================

      - name: Verifier les fichiers
        run: |
          mkdir -p data
          test -f Collectors/collect.py
          test -f Collectors/requirements.txt
          python -m py_compile Collectors/collect.py
          echo "Fichiers V6 valides"

      # ========================================
      # 5. COLLECTE V6
      # ========================================

      - name: Collecter les oeuvres V6
        run: |
          python Collectors/collect.py

      # ========================================
      # 6. DIAGNOSTIC PDF
      # ========================================

      - name: Diagnostic PDF BYDealers
        run: |
          if [ -f Collectors/diagnostic_pdf.py ]; then
            python Collectors/diagnostic_pdf.py
          else
            echo "Diagnostic facultatif absent"
          fi

      # ========================================
      # 7. VERIFICATION DES RESULTATS
      # ========================================

      - name: Verifier les resultats
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          oeuvres = json.loads(
              Path("data/oeuvres.json").read_text(
                  encoding="utf-8"
              )
          )

          rapport = json.loads(
              Path("data/rapport-collecte.json").read_text(
                  encoding="utf-8"
              )
          )

          assert isinstance(oeuvres, list)
          assert rapport["version"] == "V6"

          print("================================")
          print("ART ENCHERES QUEBEC V6")
          print("================================")
          print("Nombre total d'oeuvres :", len(oeuvres))

          for maison, stats in rapport["sources"].items():
              print()
              print("Maison :", maison)
              print(
                  "PDF lus :",
                  stats["pdf_lus"]
              )
              print(
                  "Oeuvres detectees :",
                  stats["oeuvres_detectees"]
              )
              print(
                  "Nouvelles oeuvres :",
                  stats["nouvelles_oeuvres"]
              )
              print(
                  "Erreurs ou blocages :",
                  stats["erreurs_ou_blocages"]
              )

          if not oeuvres:
              print(
                  "ATTENTION : aucune oeuvre detectee"
              )
          PY

      # ========================================
      # 8. ENREGISTRER LES DONNEES
      # ========================================

      - name: Enregistrer les resultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Collecte Art Encheres Quebec V6"
            git push
          fi

      # ========================================
      # 9. RAPPORT FINAL
      # ========================================

      - name: Rapport final
        if: always()
        run: |
          echo "================================"
          echo " ART ENCHERES QUEBEC V6"
          echo "================================"

          if [ -f data/rapport-collecte.json ]; then
            cat data/rapport-collecte.json
          else
            echo "Rapport absent"
          fi

          echo ""
          echo "Fin de l'execution."
