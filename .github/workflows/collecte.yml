
name: Collecte publique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:
  collecte:
    name: Art Encheres Quebec V8.9
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Collectors/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Collectors/requirements.txt

      - name: Verifier la syntaxe du collecteur
        run: python -m py_compile Collectors/collect.py

      - name: Executer la collecte V8.9
        run: python -u Collectors/collect.py

      - name: Valider les rapports et la base
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = Path('data')
          names = [
              'oeuvres.json',
              'rapport-collecte.json',
              'rapport-qualite.json',
              'rapport-differences.json',
          ]
          docs = {}
          for name in names:
              path = data / name
              if not path.is_file():
                  raise SystemExit(f'Fichier manquant : {path}')
              docs[name] = json.loads(
                  path.read_text(encoding='utf-8')
              )

          raw = docs['oeuvres.json']
          records = (
              raw.get('oeuvres', [])
              if isinstance(raw, dict)
              else raw
          )
          assert isinstance(records, list), 'Base invalide'
          assert len(records) >= 491, 'Perte de notices'

          ids = [
              item.get('id_passage')
              for item in records
          ]
          assert all(ids), 'Identifiant manquant'
          assert len(ids) == len(set(ids)), 'Doublons'

          report = docs['rapport-collecte.json']
          quality = docs['rapport-qualite.json']
          differences = docs['rapport-differences.json']

          for name, obj in [
              ('collecte', report),
              ('qualite', quality),
              ('differences', differences),
          ]:
              assert obj.get('version') == 'V8.9', (
                  f'Version incorrecte : {name}'
              )

          assert report.get('total_oeuvres') == len(records)
          assert quality.get('total_oeuvres') == len(records)

          source = report.get(
              'sources', {}
          ).get('BYDealers', {})

          assert source.get('pdf_lus') == 8
          assert source.get('erreurs_ou_blocages') == 0
          assert len(report.get('catalogues', [])) == 8
          assert all(
              c.get('statut') == 'ok'
              for c in report['catalogues']
          )
          assert report.get(
              'lots_historiques_non_redetectes'
          ) == 0

          for item in records:
              low = item.get('estimation_min')
              high = item.get('estimation_max')

              if low is not None or high is not None:
                  assert isinstance(
                      low, (int, float)
                  )
                  assert isinstance(
                      high, (int, float)
                  )
                  assert 1000 <= low <= high <= 100_000_000

              if item.get('prix_realise_verifie') is True:
                  assert (
                      item.get('prix_marteau') is not None
                      or item.get('prix_vendu') is not None
                  )

          conflicts = differences.get(
              'conflits_a_verifier', []
          )
          assert isinstance(conflicts, list)

          print('VALIDATION V8.9 REUSSIE')
          print('Oeuvres :', len(records))
          print(
              'Estimations :',
              quality.get('avec_estimation')
          )
          print(
              'Dimensions :',
              quality.get('avec_dimensions')
          )
          print(
              'Conflits a verifier :',
              len(conflicts)
          )
          PY

      - name: Archiver les rapports V8.9
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-collecte-v8-9
          path: |
            data/rapport-collecte.json
            data/rapport-qualite.json
            data/rapport-differences.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enregistrer les nouvelles donnees
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/oeuvres.json data/rapport-collecte.json data/rapport-qualite.json data/rapport-differences.json
          if git diff --cached --quiet; then
            echo 'Aucun changement a enregistrer.'
          else
            git commit -m 'Collecte BYDealers V8.9'
            git push
          fi

      - name: Afficher le rapport final
        run: |
          echo 'ART ENCHERES QUEBEC - RAPPORT V8.9'
          echo '======================================'
          cat data/rapport-collecte.json
