
name: Collecte publique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:
  collecte:
    name: Art Encheres Quebec V8.1
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Collectors/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Collectors/requirements.txt

      - name: Verifier la syntaxe Python
        run: |
          python -m py_compile Collectors/collect.py

      - name: Executer la collecte V8.1
        run: |
          python -u Collectors/collect.py

      - name: Verifier les fichiers JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          names = [
              "data/oeuvres.json",
              "data/rapport-collecte.json",
              "data/rapport-qualite.json",
          ]

          for name in names:
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f"Fichier absent : {name}")

              with path.open(encoding="utf-8") as f:
                  json.load(f)

              print("JSON valide :", name)

          with open("data/oeuvres.json", encoding="utf-8") as f:
              oeuvres = json.load(f)

          with open("data/rapport-collecte.json", encoding="utf-8") as f:
              rapport = json.load(f)

          with open("data/rapport-qualite.json", encoding="utf-8") as f:
              qualite = json.load(f)

          assert isinstance(oeuvres, list)
          assert rapport["version"] == "V8.1"
          assert qualite["version"] == "V8.1"
          assert rapport["total_oeuvres"] == len(oeuvres)

          # Ne pas perdre les 488 notices de la V7.
          if len(oeuvres) < 488:
              raise SystemExit(
                  "ERREUR : moins de 488 notices. "
                  "Publication annulee."
              )

          print("Notices :", len(oeuvres))
          print("Estimations :", qualite["avec_estimation"])
          print("Dimensions :", qualite["avec_dimensions"])
          print("Rapprochements :", qualite["nombre_rapprochements"])
          print("Anomalies :", qualite["nombre_notices_a_controler"])
          PY

      - name: Enregistrer les resultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/oeuvres.json
          git add data/rapport-collecte.json
          git add data/rapport-qualite.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Actualisation Art Encheres Quebec V8.1"
            git pull --rebase
            git push
          fi

      - name: Afficher le rapport final
        if: always()
        run: |
          echo "ART ENCHERES QUEBEC V8.1"

          if [ -f data/rapport-collecte.json ]; then
            cat data/rapport-collecte.json
          fi
