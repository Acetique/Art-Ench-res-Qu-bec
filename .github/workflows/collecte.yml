
name: Collecte publique quotidienne

# ==========================================================
# ART ENCHERES QUEBEC - WORKFLOW V8.7
# ==========================================================
#
# Compatible avec :
#   Collectors/collect.py V8.7
#
# Fonctionnement :
#   1. Recuperer le depot
#   2. Installer Python
#   3. Installer les dependances
#   4. Verifier la syntaxe du collecteur
#   5. Executer la collecte BYDealers
#   6. Valider les donnees
#   7. Publier les JSON sur GitHub
#   8. Afficher le rapport final
#
# ==========================================================

on:
  workflow_dispatch:

  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:

  collecte:

    name: Art Encheres Quebec V8.7

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      # ====================================================
      # 1. RECUPERER LE DEPOT
      # ====================================================

      - name: Recuperer le depot GitHub
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ====================================================
      # 2. INSTALLER PYTHON
      # ====================================================

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Collectors/requirements.txt

      # ====================================================
      # 3. INSTALLER LES DEPENDANCES
      # ====================================================

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Collectors/requirements.txt

      # ====================================================
      # 4. VERIFIER LA SYNTAXE
      # ====================================================

      - name: Verifier la syntaxe Python
        run: |
          python -m py_compile Collectors/collect.py
          echo "Syntaxe Python valide."

      # ====================================================
      # 5. EXECUTER LA COLLECTE
      # ====================================================

      - name: Executer la collecte V8.7
        run: |
          echo "======================================"
          echo "ART ENCHERES QUEBEC"
          echo "COLLECTE AUTOMATIQUE V8.7"
          echo "======================================"

          python -u Collectors/collect.py

      # ====================================================
      # 6. VALIDATION DES RESULTATS
      # ====================================================

      - name: Valider les donnees V8.7
        run: |
          python - <<'PY'

          import json
          from pathlib import Path
          from collections import Counter

          VERSION = "V8.7"

          MIN_NOTICES = 491
          MIN_ESTIMATIONS = 284
          MIN_DIMENSIONS = 482

          EXPECTED_CATALOGUES = {
              "Printemps 2023": 57,
              "Automne 2023": 77,
              "Printemps 2024": 62,
              "Automne 2024": 60,
              "Printemps 2025": 66,
              "Automne 2025": 71,
              "Printemps 2026": 45,
              "Succession printemps 2026": 53,
          }

          errors = []
          warnings = []

          # ================================================
          # LECTURE DES JSON
          # ================================================

          def read_json(filename):
              path = Path(filename)

              if not path.is_file():
                  raise SystemExit(
                      "Fichier absent : " + filename
                  )

              with path.open(
                  "r",
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)

              print("JSON valide :", filename)
              return data

          oeuvres = read_json(
              "data/oeuvres.json"
          )

          rapport = read_json(
              "data/rapport-collecte.json"
          )

          qualite = read_json(
              "data/rapport-qualite.json"
          )

          differences = read_json(
              "data/rapport-differences.json"
          )

          # ================================================
          # STRUCTURES
          # ================================================

          if not isinstance(oeuvres, list):
              raise SystemExit(
                  "oeuvres.json doit contenir une liste."
              )

          for name, data in [
              ("collecte", rapport),
              ("qualite", qualite),
              ("differences", differences)
          ]:
              if not isinstance(data, dict):
                  raise SystemExit(
                      "Structure invalide : " + name
                  )

              if data.get("version") != VERSION:
                  errors.append(
                      "Version incorrecte : " + name
                  )

          # ================================================
          # STATISTIQUES
          # ================================================

          total = len(oeuvres)

          estimations = sum(
              isinstance(x, dict)
              and isinstance(
                  x.get("estimation_min"),
                  (int, float)
              )
              and isinstance(
                  x.get("estimation_max"),
                  (int, float)
              )
              for x in oeuvres
          )

          dimensions = sum(
              isinstance(x, dict)
              and bool(x.get("dimensions"))
              for x in oeuvres
          )

          print("")
          print("======================================")
          print("BASE DE DONNEES V8.7")
          print("======================================")
          print("Notices :", total)
          print("Estimations :", estimations)
          print("Dimensions :", dimensions)

          if total < MIN_NOTICES:
              errors.append(
                  "Moins de 491 notices : "
                  + str(total)
              )

          if estimations < MIN_ESTIMATIONS:
              errors.append(
                  "Moins de 284 estimations : "
                  + str(estimations)
              )

          if dimensions < MIN_DIMENSIONS:
              errors.append(
                  "Moins de 482 dimensions : "
                  + str(dimensions)
              )

          if rapport.get("total_oeuvres") != total:
              errors.append(
                  "Total incoherent dans rapport-collecte."
              )

          if qualite.get("total_oeuvres") != total:
              errors.append(
                  "Total incoherent dans rapport-qualite."
              )

          if qualite.get("avec_estimation") != estimations:
              errors.append(
                  "Estimations incoherentes entre fichiers."
              )

          if qualite.get("avec_dimensions") != dimensions:
              errors.append(
                  "Dimensions incoherentes entre fichiers."
              )

          # ================================================
          # IDENTIFIANTS
          # ================================================

          ids = []

          for index, oeuvre in enumerate(oeuvres):
              if not isinstance(oeuvre, dict):
                  errors.append(
                      "Notice invalide : " + str(index)
                  )
                  continue

              identifier = oeuvre.get("id_passage")

              if not identifier:
                  errors.append(
                      "Identifiant manquant : "
                      + str(index)
                  )
              else:
                  ids.append(identifier)

          counts = Counter(ids)

          duplicates = [
              identifier
              for identifier, count in counts.items()
              if count > 1
          ]

          print("")
          print("IDENTIFIANTS")
          print("Identifiants uniques :", len(counts))
          print("Doublons :", len(duplicates))

          if duplicates:
              errors.append(
                  "Doublons detectes : "
                  + str(len(duplicates))
              )

          # ================================================
          # CATALOGUES BYDEALERS
          # ================================================

          catalogues = rapport.get(
              "catalogues", []
          )

          if not isinstance(catalogues, list):
              errors.append(
                  "Liste des catalogues invalide."
              )
              catalogues = []

          print("")
          print("======================================")
          print("CATALOGUES BYDEALERS")
          print("======================================")

          seen_sales = set()

          for catalogue in catalogues:
              if not isinstance(catalogue, dict):
                  errors.append(
                      "Entree de catalogue invalide."
                  )
                  continue

              sale = catalogue.get("vente")
              status = catalogue.get("statut")
              count = catalogue.get("oeuvres")
              pages = catalogue.get("pages")

              print(
                  sale,
                  "| statut :", status,
                  "| lots :", count,
                  "| pages :", pages
              )

              if sale in seen_sales:
                  errors.append(
                      "Catalogue duplique : " + str(sale)
                  )

              seen_sales.add(sale)

              if sale not in EXPECTED_CATALOGUES:
                  errors.append(
                      "Catalogue inattendu : " + str(sale)
                  )
                  continue

              if status != "ok":
                  errors.append(
                      "Catalogue non valide : " + str(sale)
                  )

              expected = EXPECTED_CATALOGUES[sale]

              if count != expected:
                  errors.append(
                      "Nombre de lots modifie pour "
                      + str(sale)
                      + " : "
                      + str(count)
                      + " au lieu de "
                      + str(expected)
                  )

              if not isinstance(pages, int) or pages <= 0:
                  errors.append(
                      "Nombre de pages invalide : "
                      + str(sale)
                  )

              if catalogue.get("erreurs_pages"):
                  errors.append(
                      "Erreurs PDF : " + str(sale)
                  )

          if seen_sales != set(EXPECTED_CATALOGUES):
              missing_sales = (
                  set(EXPECTED_CATALOGUES) - seen_sales
              )

              errors.append(
                  "Catalogues manquants : "
                  + ", ".join(sorted(missing_sales))
              )

          # ================================================
          # STATUT SOURCE BYDEALERS
          # ================================================

          sources = rapport.get("sources", {})

          bydealers = sources.get(
              "BYDealers", {}
          )

          pdf_lus = bydealers.get(
              "pdf_lus", 0
          )

          source_errors = bydealers.get(
              "erreurs_ou_blocages", 0
          )

          detected_source = bydealers.get(
              "oeuvres_detectees", 0
          )

          print("")
          print("SOURCE BYDEALERS")
          print("PDF lus :", pdf_lus)
          print("Lots detectes :", detected_source)
          print("Erreurs :", source_errors)

          if pdf_lus != 8:
              errors.append(
                  "Les huit PDF n'ont pas ete lus."
              )

          if source_errors != 0:
              errors.append(
                  "Erreurs pendant la collecte."
              )

          if detected_source < MIN_NOTICES:
              errors.append(
                  "Moins de 491 lots detectes."
              )

          # ================================================
          # PROTECTION HISTORIQUE
          # ================================================

          historical = differences.get(
              "historique_avant"
          )

          detected = differences.get(
              "detectes_cette_execution"
          )

          missing = differences.get(
              "non_redetectes"
          )

          print("")
          print("======================================")
          print("HISTORIQUE")
          print("======================================")
          print("Notices avant :", historical)
          print("Lots redetectes :", detected)
          print("Lots non redetectes :", missing)

          if not isinstance(historical, int):
              errors.append(
                  "Historique invalide."
              )
          elif total < historical:
              errors.append(
                  "Perte de notices historiques."
              )

          if not isinstance(detected, int):
              errors.append(
                  "Nombre de lots redetectes invalide."
              )
          elif detected < MIN_NOTICES:
              errors.append(
                  "Regression de detection des lots."
              )

          if missing != 0:
              errors.append(
                  "Lots historiques non redetectes : "
                  + str(missing)
              )

          # ================================================
          # ESTIMATIONS
          # ================================================

          suspicious = []

          for oeuvre in oeuvres:
              if not isinstance(oeuvre, dict):
                  continue

              low = oeuvre.get("estimation_min")
              high = oeuvre.get("estimation_max")

              if low is None and high is None:
                  continue

              if not (
                  isinstance(low, (int, float))
                  and isinstance(high, (int, float))
              ):
                  errors.append(
                      "Estimation incomplete : "
                      + str(oeuvre.get("id_passage"))
                  )
                  continue

              if low < 0 or high < 0 or low > high:
                  errors.append(
                      "Estimation invalide : "
                      + str(oeuvre.get("id_passage"))
                  )

              if (
                  1800 <= low <= 2100
                  and 1800 <= high <= 2100
              ):
                  suspicious.append(
                      oeuvre.get("id_passage")
                  )

          print("")
          print("ESTIMATIONS")
          print("Estimations suspectes :", len(suspicious))

          for identifier in suspicious:
              errors.append(
                  "Estimation suspecte : "
                  + str(identifier)
              )

          # ================================================
          # CONFLITS ET CORRECTIONS
          # ================================================

          conflicts = differences.get(
              "conflits_a_verifier", []
          )

          title_corrections = differences.get(
              "corrections_appliquees", []
          )

          estimate_corrections = differences.get(
              "estimations_historiques_corrigees", []
          )

          cleanups = differences.get(
              "nettoyages", []
          )

          for name, value in [
              ("conflits", conflicts),
              ("corrections de titres", title_corrections),
              ("corrections d'estimations", estimate_corrections),
              ("nettoyages", cleanups)
          ]:
              if not isinstance(value, list):
                  errors.append(
                      "Liste invalide : " + name
                  )

          if not isinstance(conflicts, list):
              conflicts = []

          if not isinstance(title_corrections, list):
              title_corrections = []

          if not isinstance(estimate_corrections, list):
              estimate_corrections = []

          if not isinstance(cleanups, list):
              cleanups = []

          print("")
          print("======================================")
          print("QUALITE V8.7")
          print("======================================")

          print(
              "Conflits a verifier :",
              len(conflicts)
          )

          print(
              "Titres corriges :",
              len(title_corrections)
          )

          print(
              "Estimations historiques corrigees :",
              len(estimate_corrections)
          )

          print(
              "Nettoyages de donnees :",
              len(cleanups)
          )

          if conflicts:
              warnings.append(
                  str(len(conflicts))
                  + " conflits restent a verifier."
              )

          # ================================================
          # CARACTERES PARASITES
          # ================================================

          control_characters = []

          for oeuvre in oeuvres:
              if not isinstance(oeuvre, dict):
                  continue

              for field in ("artiste", "titre"):
                  value = oeuvre.get(field)

                  if not isinstance(value, str):
                      continue

                  if any(
                      ord(c) < 32
                      for c in value
                  ):
                      control_characters.append({
                          "id": oeuvre.get("id_passage"),
                          "champ": field
                      })

          print("")
          print(
              "Caracteres parasites :",
              len(control_characters)
          )

          if control_characters:
              errors.append(
                  "Caracteres de controle dans "
                  + str(len(control_characters))
                  + " champs."
              )

          # ================================================
          # PRIX MARTEAU
          # ================================================

          invalid_prices = []

          for oeuvre in oeuvres:
              if not isinstance(oeuvre, dict):
                  continue

              if oeuvre.get(
                  "prix_realise_verifie"
              ) is not True:
                  continue

              if (
                  oeuvre.get("prix_marteau") is None
                  and oeuvre.get("prix_vendu") is None
              ):
                  invalid_prices.append(
                      oeuvre.get("id_passage")
                  )

          print("")
          print("PRIX MARTEAU")
          print(
              "Prix declares verifies sans montant :",
              len(invalid_prices)
          )

          if invalid_prices:
              errors.append(
                  "Prix marteau declares verifies "
                  "sans montant."
              )

          # ================================================
          # RESULTAT FINAL
          # ================================================

          print("")
          print("======================================")
          print("AVERTISSEMENTS")
          print("======================================")

          if warnings:
              for warning in warnings:
                  print("ATTENTION :", warning)
          else:
              print("Aucun avertissement.")

          print("")
          print("======================================")
          print("ERREURS")
          print("======================================")

          if errors:
              for error in errors:
                  print("ERREUR :", error)

              print("")
              print("VALIDATION V8.7 ECHOUEE")
              raise SystemExit(1)

          print("Aucune erreur bloquante.")
          print("")
          print("VALIDATION V8.7 REUSSIE")

          PY

      # ====================================================
      # 7. PUBLIER LES DONNEES
      # ====================================================

      - name: Enregistrer les resultats sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/oeuvres.json
          git add data/rapport-collecte.json
          git add data/rapport-qualite.json
          git add data/rapport-differences.json

          if git diff --cached --quiet; then
            echo "Aucun changement a enregistrer."
          else
            git commit -m "Collecte Art Encheres Quebec V8.7"
            git pull --rebase
            git push
          fi

      # ====================================================
      # 8. RAPPORT FINAL
      # ====================================================

      - name: Afficher le rapport final
        if: always()
        run: |
          echo "======================================"
          echo "ART ENCHERES QUEBEC - RAPPORT V8.7"
          echo "======================================"

          if [ -f data/rapport-collecte.json ]; then
            cat data/rapport-collecte.json
          fi

          echo ""
          echo "======================================"
          echo "FIN DU WORKFLOW"
          echo "======================================"
