
name: Collecte publique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:
  collecte:
    name: Art Encheres Quebec V8.5
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Collectors/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Collectors/requirements.txt

      - name: Verifier la syntaxe
        run: |
          python -m py_compile Collectors/collect.py

      - name: Executer la collecte V8.5
        run: |
          python -u Collectors/collect.py

      - name: Valider les resultats
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter

          VERSION = "V8.5"
          MIN_NOTICES = 491
          MIN_ESTIMATIONS = 286
          MIN_DIMENSIONS = 482

          def lire(path):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(
                      f"ERREUR fichier absent : {path}"
                  )
              return json.loads(p.read_text("utf-8"))

          oeuvres = lire("data/oeuvres.json")
          rapport = lire("data/rapport-collecte.json")
          qualite = lire("data/rapport-qualite.json")
          differences = lire("data/rapport-differences.json")

          erreurs = []

          if not isinstance(oeuvres, list):
              raise SystemExit("Base invalide")

          for name, obj in [
              ("rapport", rapport),
              ("qualite", qualite),
              ("differences", differences)
          ]:
              if obj.get("version") != VERSION:
                  erreurs.append(
                      f"Version incorrecte : {name}"
                  )

          total = len(oeuvres)

          estimations = sum(
              x.get("estimation_min") is not None
              and x.get("estimation_max") is not None
              for x in oeuvres
          )

          dimensions = sum(
              bool(x.get("dimensions"))
              for x in oeuvres
          )

          ids = [
              x.get("id_passage")
              for x in oeuvres
          ]

          doublons = [
              k for k, v in Counter(ids).items()
              if v > 1
          ]

          print("Notices :", total)
          print("Estimations :", estimations)
          print("Dimensions :", dimensions)
          print("Doublons :", len(doublons))

          if total < MIN_NOTICES:
              erreurs.append("Perte de notices")

          if estimations < MIN_ESTIMATIONS:
              erreurs.append("Regression estimations")

          if dimensions < MIN_DIMENSIONS:
              erreurs.append("Regression dimensions")

          if None in ids or "" in ids or doublons:
              erreurs.append("Identifiants invalides")

          if rapport.get("total_oeuvres") != total:
              erreurs.append("Total collecte incorrect")

          if qualite.get("total_oeuvres") != total:
              erreurs.append("Total qualite incorrect")

          if qualite.get("avec_estimation") != estimations:
              erreurs.append("Estimations incoherentes")

          if qualite.get("avec_dimensions") != dimensions:
              erreurs.append("Dimensions incoherentes")

          catalogues = rapport.get("catalogues", [])

          if len(catalogues) != 8:
              erreurs.append("Catalogues manquants")

          for c in catalogues:
              print(
                  c.get("vente"),
                  c.get("statut"),
                  c.get("oeuvres")
              )

              if c.get("statut") != "ok":
                  erreurs.append(
                      f"Catalogue invalide : {c.get('vente')}"
                  )

          byd = rapport.get(
              "sources", {}
          ).get("BYDealers", {})

          if byd.get("pdf_lus") != 8:
              erreurs.append("PDF incomplets")

          if byd.get("erreurs_ou_blocages") != 0:
              erreurs.append("Erreurs de collecte")

          missing = differences.get(
              "non_redetectes"
          )

          print("Lots non redetectes :", missing)

          if missing != 0:
              erreurs.append(
                  "Lots historiques non redetectes"
              )

          conflits = differences.get(
              "conflits_a_verifier", []
          )

          corrections = differences.get(
              "corrections_appliquees", []
          )

          print("Conflits :", len(conflits))
          print("Corrections titres :", len(corrections))

          if conflits:
              print(
                  "ATTENTION : conflits a verifier"
              )

          # Detecter les estimations ressemblant
          # a des fourchettes d'annees.
          for x in oeuvres:
              low = x.get("estimation_min")
              high = x.get("estimation_max")

              if (
                  isinstance(low, (int, float))
                  and isinstance(high, (int, float))
                  and 1800 <= low <= 2100
                  and 1800 <= high <= 2100
              ):
                  erreurs.append(
                      "Estimation suspecte : "
                      + str(x.get("id_passage"))
                  )

          if erreurs:
              for e in erreurs:
                  print("ERREUR :", e)
              raise SystemExit(1)

          print("VALIDATION V8.5 REUSSIE")
          PY

      - name: Enregistrer les resultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/oeuvres.json
          git add data/rapport-collecte.json
          git add data/rapport-qualite.json
          git add data/rapport-differences.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Collecte Art Encheres Quebec V8.5"
            git pull --rebase
            git push
          fi

      - name: Afficher le rapport final
        if: always()
        run: |
          echo "RAPPORT V8.5"

          if [ -f data/rapport-collecte.json ]; then
            cat data/rapport-collecte.json
          fi
