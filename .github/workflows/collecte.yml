
name: Collecte publique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:
  collecte:
    name: Art Encheres Quebec V8
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Collectors/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Collectors/requirements.txt

      - name: Verifier le code
        run: |
          python -m py_compile Collectors/collect.py

      - name: Executer la collecte V8
        run: |
          python Collectors/collect.py

      - name: Verifier les resultats
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("data/oeuvres.json"),
              Path("data/rapport-collecte.json"),
              Path("data/rapport-qualite.json"),
          ]

          for path in paths:
              with path.open(encoding="utf-8") as f:
                  data = json.load(f)
              print("Valide :", path)

          with paths[0].open(encoding="utf-8") as f:
              oeuvres = json.load(f)

          with paths[1].open(encoding="utf-8") as f:
              rapport = json.load(f)

          with paths[2].open(encoding="utf-8") as f:
              qualite = json.load(f)

          assert isinstance(oeuvres, list)
          assert rapport["version"] == "V8"
          assert qualite["version"] == "V8"
          assert rapport["total_oeuvres"] == len(oeuvres)

          print("Notices :", len(oeuvres))
          print("Estimations :", qualite["avec_estimation"])
          print("Dimensions :", qualite["avec_dimensions"])
          print("Rapprochements :", qualite["nombre_rapprochements"])
          print("Anomalies :", qualite["nombre_notices_a_controler"])
          PY

      - name: Enregistrer les resultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/oeuvres.json
          git add data/rapport-collecte.json
          git add data/rapport-qualite.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Actualisation Art Encheres Quebec V8"
            git pull --rebase
            git push
          fi

      - name: Afficher le rapport
        if: always()
        run: |
          if [ -f data/rapport-collecte.json ]; then
            cat data/rapport-collecte.json
          fi
