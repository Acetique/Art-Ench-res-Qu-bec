name: Collecte publique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:
  collecte:
    name: Art Encheres Quebec V8.10.1
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Collectors/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Collectors/requirements.txt

      - name: Verifier la syntaxe du collecteur
        run: python -m py_compile Collectors/collect.py

      - name: Executer la collecte V8.10.1
        run: python -u Collectors/collect.py

      - name: Valider les rapports et la base
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = Path('data')
          names = [
              'oeuvres.json',
              'rapport-collecte.json',
              'rapport-qualite.json',
              'rapport-differences.json',
          ]
          docs = {}
          for name in names:
              path = data / name
              if not path.is_file():
                  raise SystemExit(f'Fichier manquant : {path}')
              docs[name] = json.loads(path.read_text(encoding='utf-8'))

          raw = docs['oeuvres.json']
          records = raw.get('oeuvres', []) if isinstance(raw, dict) else raw
          assert isinstance(records, list), 'Base oeuvres.json invalide'
          assert len(records) >= 491, f'Perte de notices : {len(records)}'

          ids = [item.get('id_passage') for item in records]
          assert all(ids), 'Identifiant de passage manquant'
          assert len(ids) == len(set(ids)), 'Identifiants dupliques'

          report = docs['rapport-collecte.json']
          quality = docs['rapport-qualite.json']
          differences = docs['rapport-differences.json']
          for name, obj in [
              ('collecte', report),
              ('qualite', quality),
              ('differences', differences),
          ]:
              assert obj.get('version') == 'V8.10.1', f'Version incorrecte : {name}'

          assert report.get('total_oeuvres') == len(records), 'Total collecte incoherent'
          assert quality.get('total_oeuvres') == len(records), 'Total qualite incoherent'

          bydealers = report.get('sources', {}).get('BYDealers', {})
          assert bydealers.get('pdf_lus') == 8, 'Les 8 PDF ne sont pas tous lus'
          assert bydealers.get('erreurs_ou_blocages') == 0, 'Erreurs de collecte'
          assert len(report.get('catalogues', [])) == 8, 'Catalogues manquants'
          assert all(c.get('statut') == 'ok' for c in report['catalogues']), 'Catalogue en erreur'
          # La V8.10.1 conserve les lots historiques non redetectes
          # et les signale explicitement au lieu de bloquer la collecte.
          missing = report.get('lots_historiques_non_redetectes', 0)
          assert isinstance(missing, int) and 0 <= missing <= 11, (
              f'Augmentation inattendue des lots non redetectes : {missing}'
          )
          assert differences.get('non_redetectes') == missing
          assert len(differences.get('lots_non_redetectes', [])) == missing
          assert len(differences.get('details_lots_non_redetectes', [])) == missing
          print(f'ATTENTION : {missing} lots historiques restent a verifier'), 'Lots historiques perdus'

          for item in records:
              low, high = item.get('estimation_min'), item.get('estimation_max')
              if low is not None or high is not None:
                  assert isinstance(low, (int, float)) and isinstance(high, (int, float)), 'Estimation incomplete'
                  assert 1000 <= low <= high <= 100_000_000, 'Estimation invalide'
              if item.get('prix_realise_verifie') is True:
                  assert item.get('prix_marteau') is not None or item.get('prix_vendu') is not None, 'Prix verifie sans montant'

          assert isinstance(differences.get('conflits_a_verifier', []), list), 'Liste de conflits invalide'

          print('VALIDATION V8.10.1 REUSSIE')
          print('Oeuvres :', len(records))
          print('Estimations :', quality.get('avec_estimation'))
          print('Dimensions :', quality.get('avec_dimensions'))
          print('Conflits a verifier :', len(differences.get('conflits_a_verifier', [])))
          PY

      - name: Archiver les rapports V8.10.1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-collecte-v8-10-1
          path: |
            data/rapport-collecte.json
            data/rapport-qualite.json
            data/rapport-differences.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enregistrer les nouvelles donnees
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/oeuvres.json data/rapport-collecte.json data/rapport-qualite.json data/rapport-differences.json
          if git diff --cached --quiet; then
            echo 'Aucun changement a enregistrer.'
          else
            git commit -m 'Collecte BYDealers V8.10.1'
            git push
          fi

      - name: Afficher le rapport final
        run: |
          echo 'ART ENCHERES QUEBEC - RAPPORT V8.10.1'
          echo '======================================'
          cat data/rapport-collecte.json
