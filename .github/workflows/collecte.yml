
name: Collecte publique quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Collectors/requirements.txt

      - name: Installer les dependances
        run: python -m pip install -r Collectors/requirements.txt

      - name: Verifier la syntaxe
        run: python -m py_compile Collectors/collect.py

      - name: Collecter les catalogues
        run: python -u Collectors/collect.py

      - name: Valider les fichiers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              'oeuvres.json',
              'rapport-collecte.json',
              'rapport-qualite.json',
              'rapport-differences.json'
          ]

          for name in files:
              p = Path('data') / name
              assert p.exists(), f'Absent : {p}'
              json.loads(p.read_text(encoding='utf-8'))
              print('Valide :', p)

          db = json.loads(
              Path('data/oeuvres.json').read_text(encoding='utf-8')
          )
          report = json.loads(
              Path('data/rapport-collecte.json').read_text(encoding='utf-8')
          )

          assert isinstance(db, list) and len(db) >= 488
          assert report['version'] == 'V8.2'
          assert report['total_oeuvres'] == len(db)

          print('Notices :', len(db))
          PY

      - name: Sauvegarder les resultats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/oeuvres.json data/rapport-collecte.json data/rapport-qualite.json data/rapport-differences.json

          if ! git diff --cached --quiet; then
            git commit -m 'Collecte Art Encheres Quebec V8.2'
            git pull --rebase
            git push
          fi
