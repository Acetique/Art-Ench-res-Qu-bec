
name: Collecte publique quotidienne

on:
  workflow_dispatch:

  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: collecte-oeuvres
  cancel-in-progress: false

jobs:
  collecte:
    name: Art Encheres Quebec V8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # ==========================================
      # 1. RECUPERER LE DEPOT GITHUB
      # ==========================================

      - name: Recuperer le depot
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      # ==========================================
      # 2. INSTALLER PYTHON
      # ==========================================

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Collectors/requirements.txt

      # ==========================================
      # 3. INSTALLER LES DEPENDANCES
      # ==========================================

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Collectors/requirements.txt

      # ==========================================
      # 4. VERIFIER LE SCRIPT PYTHON
      # ==========================================

      - name: Verifier la syntaxe Python
        run: |
          python -m py_compile Collectors/collect.py
          echo "Syntaxe Python valide."

      # ==========================================
      # 5. EXECUTER LA COLLECTE V8.4
      # ==========================================

      - name: Executer la collecte V8.4
        run: |
          echo "======================================"
          echo "ART ENCHERES QUEBEC - COLLECTE V8.4"
          echo "======================================"

          python -u Collectors/collect.py

      # ==========================================
      # 6. VALIDATION COMPLETE DES DONNEES
      # ==========================================

      - name: Valider les resultats V8.4
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter

          VERSION = "V8.4"
          MIN_NOTICES = 491
          MIN_ESTIMATIONS = 284
          NOMBRE_CATALOGUES = 8

          print("=" * 60)
          print("ART ENCHERES QUEBEC - VALIDATION V8.4")
          print("=" * 60)

          def lire(nom):
              chemin = Path(nom)

              if not chemin.is_file():
                  raise SystemExit(
                      f"ERREUR : fichier absent : {nom}"
                  )

              with chemin.open(encoding="utf-8") as f:
                  contenu = json.load(f)

              print(f"JSON valide : {nom}")
              return contenu

          oeuvres = lire("data/oeuvres.json")
          rapport = lire("data/rapport-collecte.json")
          qualite = lire("data/rapport-qualite.json")
          differences = lire("data/rapport-differences.json")

          erreurs = []
          avertissements = []

          # --------------------------------------
          # STRUCTURE DES FICHIERS
          # --------------------------------------

          if not isinstance(oeuvres, list):
              erreurs.append(
                  "oeuvres.json doit contenir une liste."
              )
              oeuvres = []

          for nom, contenu in [
              ("rapport-collecte", rapport),
              ("rapport-qualite", qualite),
              ("rapport-differences", differences)
          ]:
              if not isinstance(contenu, dict):
                  erreurs.append(
                      f"{nom} doit contenir un objet JSON."
                  )

          if erreurs:
              for erreur in erreurs:
                  print("ERREUR :", erreur)
              raise SystemExit(1)

          # --------------------------------------
          # VERSIONS
          # --------------------------------------

          for nom, contenu in [
              ("Collecte", rapport),
              ("Qualite", qualite),
              ("Differences", differences)
          ]:
              version = contenu.get("version")

              print(f"Version {nom} : {version}")

              if version != VERSION:
                  erreurs.append(
                      f"Version {nom} incorrecte : {version}"
                  )

          # --------------------------------------
          # STATISTIQUES PRINCIPALES
          # --------------------------------------

          total = len(oeuvres)

          estimations = sum(
              isinstance(x, dict)
              and x.get("estimation_min") is not None
              and x.get("estimation_max") is not None
              for x in oeuvres
          )

          dimensions = sum(
              isinstance(x, dict)
              and bool(x.get("dimensions"))
              for x in oeuvres
          )

          marteaux_verifies = sum(
              isinstance(x, dict)
              and x.get("prix_realise_verifie") is True
              for x in oeuvres
          )

          print("\n===== BASE DE DONNEES =====")
          print("Notices :", total)
          print("Estimations :", estimations)
          print("Dimensions :", dimensions)
          print("Prix marteau verifies :", marteaux_verifies)

          if total < MIN_NOTICES:
              erreurs.append(
                  f"Seulement {total} notices. "
                  f"Minimum : {MIN_NOTICES}."
              )

          if estimations < MIN_ESTIMATIONS:
              erreurs.append(
                  f"Seulement {estimations} estimations. "
                  f"Minimum : {MIN_ESTIMATIONS}."
              )

          if rapport.get("total_oeuvres") != total:
              erreurs.append(
                  "Le total du rapport de collecte "
                  "ne correspond pas a la base."
              )

          if qualite.get("total_oeuvres") != total:
              erreurs.append(
                  "Le total du rapport de qualite "
                  "ne correspond pas a la base."
              )

          if qualite.get("avec_estimation") != estimations:
              erreurs.append(
                  "Le nombre d'estimations du rapport "
                  "ne correspond pas a la base."
              )

          if qualite.get("avec_dimensions") != dimensions:
              erreurs.append(
                  "Le nombre de dimensions du rapport "
                  "ne correspond pas a la base."
              )

          # --------------------------------------
          # IDENTIFIANTS UNIQUES
          # --------------------------------------

          ids = []

          for index, oeuvre in enumerate(oeuvres):
              if not isinstance(oeuvre, dict):
                  erreurs.append(
                      f"Notice {index} invalide."
                  )
                  continue

              identifiant = oeuvre.get("id_passage")

              if not identifiant:
                  erreurs.append(
                      f"Notice {index} sans id_passage."
                  )
              else:
                  ids.append(identifiant)

          counts = Counter(ids)

          doublons = [
              identifiant
              for identifiant, count in counts.items()
              if count > 1
          ]

          print("\n===== IDENTIFIANTS =====")
          print("Identifiants uniques :", len(counts))
          print("Doublons :", len(doublons))

          if doublons:
              erreurs.append(
                  f"{len(doublons)} identifiants dupliques."
              )

          # --------------------------------------
          # VERIFICATION DES 8 CATALOGUES
          # --------------------------------------

          catalogues = rapport.get("catalogues", [])

          if not isinstance(catalogues, list):
              erreurs.append(
                  "La liste des catalogues est invalide."
              )
              catalogues = []

          print("\n===== CATALOGUES BYDEALERS =====")

          for catalogue in catalogues:
              if not isinstance(catalogue, dict):
                  erreurs.append(
                      "Entree de catalogue invalide."
                  )
                  continue

              vente = catalogue.get("vente")
              statut = catalogue.get("statut")
              nombre = catalogue.get("oeuvres", 0)
              pages = catalogue.get("pages", 0)

              print(
                  f"{vente} | "
                  f"statut={statut} | "
                  f"lots={nombre} | "
                  f"pages={pages}"
              )

              if statut != "ok":
                  erreurs.append(
                      f"Catalogue non valide : {vente}"
                  )

              if not isinstance(nombre, int) or nombre <= 0:
                  erreurs.append(
                      f"Aucun lot detecte : {vente}"
                  )

              if catalogue.get("erreurs_pages"):
                  erreurs.append(
                      f"Erreurs de lecture : {vente}"
                  )

          if len(catalogues) != NOMBRE_CATALOGUES:
              erreurs.append(
                  f"{len(catalogues)}/"
                  f"{NOMBRE_CATALOGUES} catalogues."
              )

          sources = rapport.get("sources", {})
          byd = sources.get("BYDealers", {})

          if byd.get("pdf_lus") != NOMBRE_CATALOGUES:
              erreurs.append(
                  "Les 8 PDF n'ont pas tous ete lus."
              )

          if byd.get("erreurs_ou_blocages", 0) != 0:
              erreurs.append(
                  "La collecte contient des erreurs "
                  "ou des blocages."
              )

          # --------------------------------------
          # PROTECTION DES LOTS HISTORIQUES
          # --------------------------------------

          print("\n===== HISTORIQUE =====")

          historique = differences.get(
              "historique_avant"
          )

          detectes = differences.get(
              "detectes_cette_execution"
          )

          non_redetectes = differences.get(
              "non_redetectes"
          )

          print("Historique avant :", historique)
          print("Lots redetectes :", detectes)
          print("Lots non redetectes :", non_redetectes)

          if not isinstance(historique, int):
              erreurs.append(
                  "Historique avant invalide."
              )
          elif total < historique:
              erreurs.append(
                  "La base contient moins de notices "
                  "que l'historique precedent."
              )

          if not isinstance(detectes, int):
              erreurs.append(
                  "Nombre de lots detectes invalide."
              )
          elif detectes < MIN_NOTICES:
              erreurs.append(
                  f"Seulement {detectes} lots redetectes. "
                  f"Minimum : {MIN_NOTICES}."
              )

          if non_redetectes != 0:
              erreurs.append(
                  f"Lots historiques non redetectes : "
                  f"{non_redetectes}"
              )

          # --------------------------------------
          # CONFLITS ET CORRECTIONS PROPOSEES
          # --------------------------------------

          conflits = differences.get(
              "conflits_a_verifier", []
          )

          propositions = differences.get(
              "propositions_corrections", []
          )

          if not isinstance(conflits, list):
              erreurs.append(
                  "Liste des conflits invalide."
              )
              conflits = []

          if not isinstance(propositions, list):
              erreurs.append(
                  "Liste des propositions invalide."
              )
              propositions = []

          print("\n===== QUALITE DES EXTRACTIONS =====")
          print("Conflits :", len(conflits))
          print("Corrections proposees :", len(propositions))

          if conflits:
              avertissements.append(
                  f"{len(conflits)} conflits "
                  "a verifier manuellement."
              )

          if propositions:
              avertissements.append(
                  f"{len(propositions)} corrections "
                  "proposees, non appliquees."
              )

          # --------------------------------------
          # VERIFICATION DES PRIX
          # --------------------------------------

          print("\n===== VERIFICATION DES PRIX =====")

          prix_incoherents = 0

          for oeuvre in oeuvres:
              if not isinstance(oeuvre, dict):
                  continue

              if (
                  oeuvre.get("prix_realise_verifie") is True
                  and oeuvre.get("prix_marteau") is None
                  and oeuvre.get("prix_vendu") is None
              ):
                  prix_incoherents += 1

          print(
              "Prix realises incoherents :",
              prix_incoherents
          )

          if prix_incoherents:
              erreurs.append(
                  f"{prix_incoherents} prix declares "
                  "verifies sans montant."
              )

          # --------------------------------------
          # RAPPORT FINAL
          # --------------------------------------

          print("\n===== AVERTISSEMENTS =====")

          if avertissements:
              for avertissement in avertissements:
                  print("ATTENTION :", avertissement)
          else:
              print("Aucun avertissement.")

          print("\n===== ERREURS =====")

          if erreurs:
              for erreur in erreurs:
                  print("ERREUR :", erreur)

              print("\nVALIDATION V8.4 ECHOUEE")
              raise SystemExit(1)

          print("Aucune erreur bloquante.")
          print("\nVALIDATION V8.4 REUSSIE")
          PY

      # ==========================================
      # 7. ENREGISTRER LES DONNEES SUR GITHUB
      # ==========================================

      - name: Enregistrer les resultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/oeuvres.json
          git add data/rapport-collecte.json
          git add data/rapport-qualite.json
          git add data/rapport-differences.json

          if git diff --cached --quiet; then
            echo "Aucun changement a enregistrer."
          else
            git commit -m "Actualisation Art Encheres Quebec V8.4"
            git pull --rebase
            git push
          fi

      # ==========================================
      # 8. RAPPORT FINAL
      # ==========================================

      - name: Afficher le rapport final
        if: always()
        run: |
          echo "======================================"
          echo "ART ENCHERES QUEBEC - RAPPORT V8.4"
          echo "======================================"

          if [ -f data/rapport-collecte.json ]; then
            cat data/rapport-collecte.json
          fi

          echo ""
          echo "======================================"
          echo "FIN DU WORKFLOW"
          echo "======================================"
