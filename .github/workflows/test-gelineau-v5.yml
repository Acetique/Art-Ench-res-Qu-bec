
name: "Test pagination Gélineau V5.1"

on:
  workflow_dispatch:
  push:
    paths:
      - "Collectors/test_gelineau_v5.py"
      - ".github/workflows/test-gelineau-v5.yml"

permissions:
  contents: read

jobs:
  test-pagination:
    name: "Tester la pagination Gélineau"
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install requests

      - name: Tester la pagination du catalogue 784138
        run: python Collectors/test_gelineau_v5.py

      - name: Conserver le rapport même en cas d'échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-test-gelineau-v5
          path: data/test-gelineau-v5.json
          if-no-files-found: warn
