
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Enchères Québec V2</title>
<style>
:root {
  --bg:#f5f6f8;
  --white:#fff;
  --navy:#17253c;
  --gold:#b58a46;
  --border:#e0e4ea;
  --muted:#687385;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--navy);
}
header {
  background:var(--navy);
  color:white;
  padding:30px 20px;
  text-align:center;
}
header h1 { margin:0 0 8px; }
header p { color:#d4dce8; margin:0; }
main {
  max-width:1250px;
  margin:auto;
  padding:25px 18px;
}
.panel {
  background:white;
  padding:20px;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:20px;
}
.filters {
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:12px;
}
input,select,button {
  padding:12px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:15px;
  width:100%;
}
button {
  background:var(--navy);
  color:white;
  cursor:pointer;
}
button:hover { background:#304868; }
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}
.stat {
  background:white;
  padding:18px;
  border-radius:10px;
  border:1px solid var(--border);
}
.stat strong {
  display:block;
  font-size:26px;
  margin-top:8px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}
.card {
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}
.photo {
  height:230px;
  background:#e9edf2;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  text-align:center;
}
.photo img {
  width:100%;
  height:100%;
  object-fit:contain;
}
.details { padding:17px; }
.details h3 { margin:5px 0 10px; }
.meta {
  font-size:13px;
  color:var(--muted);
  margin:7px 0;
}
.price {
  font-size:21px;
  font-weight:bold;
  margin:15px 0;
}
.badge {
  display:inline-block;
  padding:5px 9px;
  border-radius:6px;
  background:#edf0f4;
  font-size:12px;
  font-weight:bold;
}
.sold { background:#dcece2; color:#20603a; }
.sale { background:#fff0d5; color:#8b5b10; }
.link {
  display:block;
  text-decoration:none;
  text-align:center;
  background:var(--navy);
  color:white;
  padding:11px;
  border-radius:8px;
}
.empty {
  text-align:center;
  padding:55px 20px;
  color:var(--muted);
}
footer {
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
  font-size:13px;
}
@media(max-width:900px) {
  .filters { grid-template-columns:1fr 1fr; }
  .grid { grid-template-columns:1fr 1fr; }
}
@media(max-width:600px) {
  .filters,.grid,.stats {
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>
<header>
  <h1>ART ENCHÈRES QUÉBEC</h1>
  <p>BYDealers · Heffel · Gélineau</p>
</header>

<main>
<section class="panel">
  <h2>Rechercher des œuvres</h2>
  <div class="filters">
    <input
      id="search"
      placeholder="Artiste, titre, série..."
    >
    <select id="house">
      <option value="">Toutes les maisons</option>
      <option value="BYDealers">BYDealers</option>
      <option value="Heffel">Heffel</option>
      <option value="Gelineau">Gélineau</option>
    </select>
    <select id="status">
      <option value="">Tous les statuts</option>
      <option value="en_vente">En vente</option>
      <option value="vendu">Vendu</option>
      <option value="a_verifier">À vérifier</option>
    </select>
    <select id="sort">
      <option value="recent">Plus récents</option>
      <option value="price_asc">Prix croissant</option>
      <option value="price_desc">Prix décroissant</option>
      <option value="artist">Artiste A-Z</option>
    </select>
  </div>
</section>

<section class="stats">
  <div class="stat">
    Œuvres répertoriées
    <strong id="total">0</strong>
  </div>
  <div class="stat">
    En vente
    <strong id="available">0</strong>
  </div>
  <div class="stat">
    Vendues
    <strong id="sold">0</strong>
  </div>
</section>

<section id="gallery" class="grid"></section>

<div id="message" class="empty">
  Chargement des œuvres...
</div>
</main>

<footer>
  Art Enchères Québec V2
  <p>
    Informations à vérifier auprès
    des maisons d'enchères.
  </p>
</footer>

<script>
let works = [];

const gallery = document.getElementById("gallery");
const message = document.getElementById("message");

const search = document.getElementById("search");
const house = document.getElementById("house");
const status = document.getElementById("status");
const sort = document.getElementById("sort");

function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[c]
  );
}

function money(value, currency="CAD") {
  if (value === null ||
      value === undefined ||
      value === "") {
    return "Prix non disponible";
  }

  const number = Number(value);

  if (!Number.isFinite(number)) {
    return "Prix non disponible";
  }

  return new Intl.NumberFormat("fr-CA", {
    style:"currency",
    currency:currency || "CAD",
    maximumFractionDigits:0
  }).format(number);
}

// CORRECTION V8.11 : accepte les chemins relatifs
// comme images/bydealers/photo.jpg.
function safeURL(value) {
  if (typeof value !== "string" || !value.trim()) {
    return "";
  }

  try {
    const url = new URL(value.trim(), document.baseURI);

    return ["https:","http:"].includes(url.protocol)
      ? url.href
      : "";
  } catch {
    return "";
  }
}

function normalize(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase();
}

function render() {
  const query = normalize(search.value);

  let filtered = works.filter(w => {
    const text = normalize(
      [w.artiste,w.titre,w.maison].join(" ")
    );

    return (
      text.includes(query) &&
      (!house.value || w.maison === house.value) &&
      (!status.value || w.statut === status.value)
    );
  });

  if (sort.value === "price_asc") {
    filtered.sort((a,b) =>
      (Number(a.prix) || Infinity) -
      (Number(b.prix) || Infinity)
    );
  } else if (sort.value === "price_desc") {
    filtered.sort((a,b) =>
      (Number(b.prix) || -Infinity) -
      (Number(a.prix) || -Infinity)
    );
  } else if (sort.value === "artist") {
    filtered.sort((a,b) =>
      String(a.artiste || "").localeCompare(
        String(b.artiste || ""),"fr"
      )
    );
  } else {
    filtered.sort((a,b) =>
      String(b.date_collecte || "").localeCompare(
        String(a.date_collecte || "")
      )
    );
  }

  document.getElementById("total").textContent =
    works.length;

  document.getElementById("available").textContent =
    works.filter(w => w.statut === "en_vente").length;

  document.getElementById("sold").textContent =
    works.filter(w => w.statut === "vendu").length;

  gallery.innerHTML = "";

  message.style.display =
    filtered.length ? "none" : "block";

  if (!filtered.length) {
    message.textContent = works.length
      ? "Aucune œuvre ne correspond aux filtres."
      : "Aucune œuvre répertoriée pour le moment.";
  }

  filtered.forEach(w => {
    const image = safeURL(w.image);
    const link = safeURL(w.url);

    const badgeClass =
      w.statut === "vendu" ? "sold" :
      w.statut === "en_vente" ? "sale" : "";

    const badgeText =
      w.statut === "vendu" ? "Vendu" :
      w.statut === "en_vente" ? "En vente" :
      "À vérifier";

    const priceLabel =
      w.type_prix === "prix_marteau"
        ? "Prix marteau"
        : w.type_prix === "prix_vendu"
        ? "Prix vendu"
        : "Prix affiché";

    const card = document.createElement("article");
    card.className = "card";

    card.innerHTML = `
      <div class="photo">
        ${image
          ? `<img
               src="${escapeHTML(image)}"
               alt="${escapeHTML(w.titre || "Œuvre")}"
               loading="lazy"
             >`
          : "Photo non disponible"}
      </div>

      <div class="details">
        <span class="badge ${badgeClass}">
          ${badgeText}
        </span>

        <p class="meta">
          ${escapeHTML(w.maison)}
        </p>

        <h3>
          ${escapeHTML(w.artiste || "Artiste inconnu")}
        </h3>

        <p>
          ${escapeHTML(w.titre || "Sans titre")}
        </p>

        <p class="meta">
          ${escapeHTML(
            w.dimensions || "Dimensions non disponibles"
          )}
        </p>

        <div class="price">
          ${money(w.prix,w.devise)}
        </div>

        <p class="meta">${priceLabel}</p>

        ${link
          ? `<a class="link"
                href="${escapeHTML(link)}"
                target="_blank"
                rel="noopener noreferrer">
                Voir l'œuvre
              </a>`
          : ""}
      </div>
    `;

    // Affiche un message si le fichier image est
    // absent ou inaccessible sur GitHub Pages.
    const img = card.querySelector(".photo img");

    if (img) {
      img.addEventListener("error", () => {
        const photo = card.querySelector(".photo");
        photo.textContent = "Photo non disponible";
      });
    }

    gallery.appendChild(card);
  });
}

async function loadWorks() {
  try {
    const response = await fetch(
      "data/oeuvres.json?t=" + Date.now(),
      {cache:"no-store"}
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    works = Array.isArray(data)
      ? data
      : Array.isArray(data.oeuvres)
      ? data.oeuvres
      : [];

    render();
  } catch(error) {
    message.style.display = "block";
    message.textContent =
      "Impossible de charger data/oeuvres.json : " +
      error.message;
    console.error(error);
  }
}

[search,house,status,sort].forEach(element => {
  element.addEventListener("input",render);
  element.addEventListener("change",render);
});

loadWorks();
</script>
</body>
</html>
